<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="titleGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <radialGradient id="glowCyanL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreenL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotsL" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#E2E8F0"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGradL)"/>
  <rect width="1200" height="300" fill="url(#dotsL)" opacity="0.8"/>

  <circle cx="1000" cy="90" r="160" fill="url(#glowCyanL)">
    <animate attributeName="r" values="150;185;150" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="210" r="130" fill="url(#glowGreenL)">
    <animate attributeName="r" values="120;150;120" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="7s" repeatCount="indefinite"/>
  </circle>

  <g opacity="0.55" stroke="#059669" stroke-width="1.4" fill="none">
    <path d="M 900 60 L 960 60 L 960 110 L 1030 110"/>
    <path d="M 940 200 L 1000 200 L 1000 150 L 1080 150"/>
    <path d="M 1060 60 L 1060 90 L 1120 90"/>
    <path d="M 1030 110 L 1080 150"/>
  </g>
  <g>
    <circle cx="900" cy="60" r="4" fill="#0E7490">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1030" cy="110" r="4" fill="#0E7490">
      <animate attributeName="opacity" values="1;0.6;1" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="940" cy="200" r="4" fill="#059669">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="150" r="4" fill="#059669">
      <animate attributeName="opacity" values="1;0.6;1" dur="3.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="90" r="4" fill="#0E7490">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1060" cy="90" r="3" fill="#059669">
      <animate attributeName="opacity" values="1;0.6;1" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="1000" y="255" font-size="64" font-weight="700" fill="#E2E8F0">&lt;/&gt;</text>

  <rect x="0" y="0" width="6" height="300" fill="#0E7490"/>

  <text x="70" y="118" font-size="46" font-weight="700" fill="url(#titleGradL)">Hi, I'm Nihal Tarwariya</text>
  <text x="70" y="152" font-size="19" font-weight="500" fill="#334155">Computer Science &amp; Engineering Student</text>
  <text x="70" y="180" font-size="15" font-weight="500" fill="#64748B">DSA • Data Science • AI/ML • Full Stack</text>

  <g transform="translate(70,214)">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#059669">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <text x="20" y="9" font-size="15" font-weight="600" fill="#0E7490" letter-spacing="1.5">BUILD</text>
    <text x="98" y="9" font-size="15" fill="#94A3B8">•</text>
    <text x="112" y="9" font-size="15" font-weight="600" fill="#0E7490" letter-spacing="1.5">LEARN</text>
    <text x="196" y="9" font-size="15" fill="#94A3B8">•</text>
    <text x="210" y="9" font-size="15" font-weight="600" fill="#0E7490" letter-spacing="1.5">SOLVE</text>
  </g>
</svg>
